<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGUARDINVERT - NextGen Ultimate Dashboard</title>
    <!-- Google Fonts, Chart.js for Graphics & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #080b11 0%, #121824 100%);
            --glass-bg: rgba(22, 30, 46, 0.7);
            --glass-border: rgba(255, 255, 255, 0.06);
            --neon-green: #00ffaa;
            --neon-blue: #00bfff;
            --neon-red: #ff3366;
            --neon-orange: #ffaa00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg-gradient); color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }

        .app-container { width: 100%; max-width: 450px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 40px; padding: 30px 25px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); }

        /* Battery Styles */
        .battery-sec { position: relative; width: 220px; height: 220px; margin: 0 auto 25px; }
        .ring-progress { fill: none; stroke: url(#gradientGreen); stroke-width: 12; stroke-linecap: round; stroke-dasharray: 565.4; stroke-dashoffset: 214.8; }
        .battery-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .battery-inner h1 { font-family: 'Orbitron', sans-serif; font-size: 2.8rem; font-weight: 700; color: #fff; }
        
        /* Grid & Button Styles */
        .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .cyber-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; }
        .glow-power-btn { width: 65px; height: 65px; background: #1a2333; border: 2px solid var(--neon-green); border-radius: 50%; color: var(--neon-green); cursor: pointer; }
        .glow-power-btn.off { border-color: var(--neon-red); color: var(--neon-red); }
        .section-header { font-size: 0.85rem; font-weight: 700; color: var(--neon-blue); text-transform: uppercase; margin: 25px 0 12px 5px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>VGUARDINVERT</h2>
            <div class="connection-status"><i class="fa-solid fa-bluetooth"></i> BLE Connected</div>
        </div>

        <div class="battery-sec">
            <svg class="svg-ring" width="220" height="220">
                <defs><linearGradient id="gradientGreen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00ffaa" /><stop offset="100%" stop-color="#00bfff" /></linearGradient></defs>
                <circle cx="110" cy="110" r="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="12" />
                <circle class="ring-progress" cx="110" cy="110" r="90" />
            </svg>
            <div class="battery-inner">
                <!-- Data यहाँ अपडेट होगा -->
                <h1 id="batPercentage">62%</h1>
                <p><i class="fa-solid fa-bolt-lightning"></i> Charging</p>
            </div>
        </div>

        <!-- Master Power Control -->
        <div class="power-hub">
            <button class="glow-power-btn" id="masterPower" onclick="toggleMasterPower()">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </div>
    </div>

    <script>
        // 1. Sketchware से डेटा रिसीव करने वाला फंक्शन
        function updateInverterData(incomingData) {
            // मान लेते हैं कि incomingData में सिर्फ प्रतिशत आ रहा है, जैसे "75"
            document.getElementById('batPercentage').innerText = incomingData + "%";
        }

        // 2. स्केचवेयर को कमांड भेजने वाला फंक्शन
        function toggleMasterPower() {
            const btn = document.getElementById('masterPower');
            btn.classList.toggle('off');
            
            if(btn.classList.contains('off')){
                if(window.Android) { window.Android.sendPowerCommand("OFF"); }
            } else {
                if(window.Android) { window.Android.sendPowerCommand("ON"); }
            }
        }
    </script>
</body>
</html>
